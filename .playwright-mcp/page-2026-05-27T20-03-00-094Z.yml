            - generic [ref=e808]:
              - text: What if the work you did every day could impact the lives of people you know? Or all of humanity?
              - heading [level=2]
              - paragraph [ref=e809]
              - text: At Illumina, we are expanding access to genomic technology to realize health equity for billions of people around the world. Our efforts enable life-changing discoveries that are transforming human health through the early detection and diagnosis of diseases and new treatment options for patients.
              - heading [level=2]
              - paragraph [ref=e810]
              - text: Working at Illumina means being part of something bigger than yourself. Every person, in every role, has the opportunity to make a difference. Surrounded by extraordinary people, inspiring leaders, and world changing projects, you will do more and become more than you ever thought possible.
              - heading [level=2]
              - paragraph [ref=e811]
              - paragraph [ref=e812]: Position Summary
              - paragraph [ref=e813]
              - paragraph [ref=e814]: The Principal Deep Learning/AI Engineer Bioinformatics is a senior hands-on technical expert responsible for inventing, implementing, and validating AI- and ML-driven bioinformatics methods that directly power Illumina’s sequencing and analysis products. This role is primarily technical in nature, with deep personal ownership of algorithm design, model development, benchmarking, and production readiness. The role partners with product and engineering to ensure AI methods are scientifically sound, performant at scale, and ready for real-world customer and/or clinical use, while providing technical direction and mentorship.
              - paragraph [ref=e815]
              - paragraph [ref=e816]: Key Responsibilities
              - list [ref=e817]:
                - listitem [ref=e818]: "Hands-on algorithm and model development: Design, prototype, and implement AI/ML methods for genomics and multiomics (e.g., basecalling, variant calling, error modeling, QC, anomaly detection, methylation, single-cell, metagenomics, assembly, interpretation)."
                - listitem [ref=e819]: "Technical ownership of AI in products: Serve as the technical authority for AI features embedded in Illumina software and pipelines, from concept through production release."
                - listitem [ref=e820]: "People leadership: Lead a focused team to create, enhance, and sustain ML and AI products and tools."
                - listitem [ref=e821]: "Benchmarking and validation: Define gold-standard datasets, evaluation metrics, and statistical validation approaches; personally review and approve model performance and scientific claims."
                - listitem [ref=e822]: "Production ML rigor: Work directly with engineers to ensure models are reproducible, versioned, monitored, and robust in production (training pipelines, inference efficiency, regression detection)."
                - listitem [ref=e823]: "Data-centric AI leadership: Drive data strategy for model performance, including curation, labeling, augmentation, and bias/edge-case analysis across instruments, assays, and populations."
                - listitem [ref=e824]: "Technical design reviews: Lead architecture and design reviews for AI and bioinformatics components; set coding, testing, and documentation standards."
                - listitem [ref=e825]: "AI adoption through technical excellence: Enable adoption by delivering models that measurably improve accuracy, speed, cost, and usability—rather than through programmatic or organizational mandates."
                - listitem [ref=e826]: "Regulated and clinical readiness: Provide technical input and documentation for design controls, traceability, and validation where AI methods are used in regulated contexts."
                - listitem [ref=e827]: "Mentorship and technical guidance: Mentor senior and junior scientists and engineers as a technical authority and reviewer."
                - listitem [ref=e828]: "External technical engagement: Patent, present, and -on occasion- publish technical work; evaluate external methods, tools, and collaborations for technical fit and differentiation."
              - paragraph [ref=e829]
              - paragraph [ref=e830]: Required Qualifications
              - list [ref=e831]:
                - listitem [ref=e832]: Typically requires a minimum of 15 years of related experience with a Bachelor’s degree; or 12 years and a Master’s degree; or a PhD with 8 years of experience; or equivalent experience.
                - listitem [ref=e833]: PhD (strongly preferred) or MS with equivalent depth in Bioinformatics, Computational Biology, Computer Science, Statistics, or a related field.
                - listitem [ref=e834]: 10+ years of hands-on experience developing algorithms and ML models for biological data, with sustained personal technical contribution.
                - listitem [ref=e835]: Proven track record of shipping AI/ML-driven bioinformatics methods into production software used by external customers.
                - listitem [ref=e836]: Deep expertise in genomics data types and workflows (FASTQ/BAM/CRAM/VCF, reference genomes, annotations, pipelines).
                - listitem [ref=e837]: Strong applied ML background, including deep learning, probabilistic modeling, and rigorous model evaluation.
                - listitem [ref=e838]: Demonstrated ability to work close to the code and data, including reviewing implementations and results.
              - paragraph [ref=e839]
              - paragraph [ref=e840]: Preferred Qualifications
              - list [ref=e841]:
                - listitem [ref=e842]: Experience with sequencing-instrument–adjacent AI (basecalling, signal processing, error modeling, run QC).
                - listitem [ref=e843]: Experience operating in regulated or clinical software environments.
                - listitem [ref=e844]: Publications and/or patents in AI, ML, or bioinformatics with clear product relevance.
                - listitem [ref=e845]: Experience optimizing models for scale, latency, and cost in production environments.
                - listitem [ref=e846]: Hands on experience leveraging AI tools for development work.
              - paragraph [ref=e847]
              - paragraph [ref=e848]: Role Emphasis
              - paragraph [ref=e849]
              - paragraph [ref=e850]: This role is designed as a technical authority and hands-on expert. Success is measured by the quality, robustness, and real-world impact of AI/ML bioinformatics methods shipped into Illumina products.
              - paragraph [ref=e851]
              - paragraph [ref=e852]: "#LI-HYBRID"
              - heading [level=3]
              - paragraph [ref=e853]
              - text: "The estimated base salary range for the Principal Deep Learning/AI Engineer, Bioinformatics role based in the United States of America is: $205,100 - $307,700. Should the level or location of the role change during the hiring process, the applicable base pay range may be updated accordingly. The range reflects long‑term growth in the role. Most candidates are hired between the minimum and middle of the range. Placement depends on experience, skills, location, and internal equity. Additionally, all employees are eligible for one of our variable cash programs (bonus or commission) and eligible roles may receive equity as part of the compensation package. We offer a wide range of benefits as innovative as our work, including access to genomics sequencing, family planning, health/dental/vision, retirement benefits, and paid time off."
              - heading [level=3]
              - paragraph [ref=e854]
              - text: "We are a company deeply rooted in belonging, promoting an inclusive environment where employees feel valued and empowered to contribute to our mission. Built on a strong foundation, Illumina has always prioritized openness, collaboration, and seeking alternative perspectives to propel innovation in genomics. We are proud to confirm a zero-net gap in pay, regardless of gender, ethnicity, or race. We also have several Employee Resource Groups (ERG) that deliver career development experiences, increase cultural awareness, and offer opportunities to engage in social responsibility. We are proud to be an equal opportunity employer committed to providing employment opportunity regardless of sex, race, creed, color, gender, religion, marital status, domestic partner status, age, national origin or ancestry, physical or mental disability, medical condition, sexual orientation, pregnancy, military or veteran status, citizenship status, and genetic information. Illumina conducts background checks on applicants for whom a conditional offer of employment has been made. Qualified applicants with arrest or conviction records will be considered for employment in accordance with applicable local, state, and federal laws. Background check results may potentially result in the withdrawal of a conditional offer of employment. The background check process and any decisions made as a result shall be made in accordance with all applicable local, state, and federal laws. Illumina prohibits the use of generative artificial intelligence (AI) in the application and interview process. If you require accommodation to complete the application or interview process, please contact accommodations@illumina.com. To learn more, visit: https://www.dol.gov/ofccp/regs/compliance/posters/pdf/eeopost.pdf. The position will be posted until a final candidate is selected or the requisition has a sufficient number of qualified applicants."
