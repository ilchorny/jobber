[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobber"
version = "0.1.0"
description = "Generate tailored resumes and cover letters from a job description and a folder of your past materials."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "jobber contributors" }]
keywords = ["resume", "cover-letter", "job-search", "llm", "anthropic", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "anthropic>=0.40.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "httpx>=0.27",
    "markdown>=3.6",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-snapshot>=0.9",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
]

[project.scripts]
jobber = "jobber.cli:app"

[project.urls]
Homepage = "https://github.com/ilchorny/jobber"
Issues = "https://github.com/ilchorny/jobber/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/jobber"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
