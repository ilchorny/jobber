repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^(examples/sample/|tests/fixtures/)

  - repo: local
    hooks:
      - id: personal-data-scan
        name: personal-data-scan
        entry: python scripts/personal_data_scan.py
        language: system
        types: [text]
        exclude: ^(\.pre-commit-config\.yaml|scripts/personal_data_scan\.py|README\.md|\.gitignore)$
